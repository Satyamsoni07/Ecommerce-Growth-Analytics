version: 2

models:
  - name: fct_orders
    description: Order-level fact table for business and BI analysis.

    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique

      - name: customer_id
        data_tests:
          - not_null

      - name: customer_unique_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_unique_id

      - name: order_status
        data_tests:
          - not_null

      - name: order_purchase_timestamp
        data_tests:
          - not_null

      - name: order_purchase_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day


  - name: dim_customers
    description: Customer dimension containing one row per persistent real customer.

    columns:
      - name: customer_unique_id
        data_tests:
          - not_null
          - unique

      - name: customer_city
        data_tests:
          - not_null

      - name: customer_state
        data_tests:
          - not_null


  - name: dim_products
    description: Product dimension containing one row per product with category and physical attributes.

    columns:
      - name: product_id
        data_tests:
          - not_null
          - unique


  - name: dim_sellers
    description: Seller dimension containing one row per seller with location details.

    columns:
      - name: seller_id
        data_tests:
          - not_null
          - unique

      - name: seller_state
        data_tests:
          - not_null


  - name: fct_order_items
    description: Item-level fact table for product, seller, price, and freight analysis.

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - order_item_id

    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id

      - name: order_item_id
        data_tests:
          - not_null

      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id

      - name: seller_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_sellers')
                field: seller_id


  - name: dim_date
    description: Calendar date dimension used for time-series analysis and BI reporting.

    columns:
      - name: date_day
        data_tests:
          - not_null
          - unique

      - name: year
        data_tests:
          - not_null

      - name: year_month
        data_tests:
          - not_null

      - name: is_reliable_analysis_period
        data_tests:
          - not_null
  - name: agg_monthly_kpis
    description: Monthly business KPI summary for delivered orders within the reliable analysis period.

    columns:
      - name: month_start
        data_tests:
          - not_null
          - unique

      - name: delivered_orders
        data_tests:
          - not_null

      - name: active_customers
        data_tests:
          - not_null

      - name: product_gmv
        data_tests:
          - not_null

      - name: average_order_value
        data_tests:
          - not_null
  - name: agg_customer_metrics
    description: Customer-level KPI summary for delivered orders within the reliable analysis period.

    columns:
      - name: customer_unique_id
        data_tests:
          - not_null
          - unique

      - name: first_order_date
        data_tests:
          - not_null

      - name: last_order_date
        data_tests:
          - not_null

      - name: delivered_order_count
        data_tests:
          - not_null

      - name: total_gmv
        data_tests:
          - not_null

      - name: average_order_value
        data_tests:
          - not_null
  - name: agg_customer_rfm
    description: Customer-level RFM metrics used for customer segmentation.

    columns:
      - name: customer_unique_id
        data_tests:
          - not_null
          - unique

      - name: recency_days
        data_tests:
          - not_null

      - name: frequency
        data_tests:
          - not_null

      - name: monetary_value
        data_tests:
          - not_null
  - name: agg_customer_rfm_scored
    description: Customer-level RFM metrics with recency, frequency, and monetary scores from 1 to 5.

    columns:
      - name: customer_unique_id
        data_tests:
          - not_null
          - unique

      - name: recency_score
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]

      - name: frequency_score
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]

      - name: monetary_score
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
  - name: agg_customer_segments
    description: Customer segmentation table derived from RFM behavior.

    columns:
      - name: customer_unique_id
        data_tests:
          - not_null
          - unique

      - name: customer_segment
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Champions
                  - Loyal Repeat Customers
                  - High-Value Recent
                  - Promising
                  - At-Risk High Value
                  - Hibernating
                  - Regular Customers
  - name: agg_cohort_retention
    description: Cohort-level monthly retention metrics for delivered customers in the reliable analysis period.

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - cohort_month
              - cohort_month_number

    columns:
      - name: cohort_month
        data_tests:
          - not_null

      - name: cohort_month_number
        data_tests:
          - not_null

      - name: cohort_size
        data_tests:
          - not_null

      - name: retained_customers
        data_tests:
          - not_null

      - name: retention_rate
        data_tests:
          - not_null
  - name: agg_customer_ltv
    description: Customer-level lifetime value proxy metrics based on historical delivered-order behavior.

    columns:
      - name: customer_unique_id
        data_tests:
          - not_null
          - unique

      - name: lifetime_gmv
        data_tests:
          - not_null

      - name: lifetime_payment_value
        data_tests:
          - not_null

      - name: customer_lifespan_days
        data_tests:
