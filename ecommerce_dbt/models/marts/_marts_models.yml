    description: Experiment performance summary by variant for the synthetic checkout A/B test.

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - experiment_id
              - variant

    columns:
      - name: experiment_id
        data_tests:
          - not_null

      - name: variant
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - control
                  - treatment

      - name: exposed_visitors
        data_tests:
          - not_null

      - name: conversions
        data_tests:
          - not_null

      - name: conversion_rate
        data_tests:
          - not_null
  - name: agg_experiment_summary
    description: One-row-per-experiment summary comparing control and treatment conversion performance.

    columns:
      - name: experiment_id
        data_tests:
          - not_null
          - unique

      - name: control_visitors
        data_tests:
          - not_null

      - name: treatment_visitors
        data_tests:
