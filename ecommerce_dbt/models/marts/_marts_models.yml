      - name: control_conversion_rate
        data_tests:
          - not_null

      - name: treatment_conversion_rate
        data_tests:
          - not_null

      - name: absolute_uplift
        data_tests:
          - not_null

      - name: relative_uplift
        data_tests:
          - not_null
  - name: agg_experiment_decision
    description: Final business-facing experiment decision summary combining validity, significance, uplift, and projected impact.

    columns:
      - name: experiment_id
        data_tests:
          - not_null
          - unique

      - name: control_conversion_rate
        data_tests:
          - not_null

      - name: treatment_conversion_rate
        data_tests:
          - not_null

      - name: absolute_uplift
        data_tests:
          - not_null

      - name: relative_uplift
        data_tests:
          - not_null

      - name: p_value
        data_tests:
          - not_null

      - name: ci_lower
        data_tests:
          - not_null

      - name: ci_upper
        data_tests:
          - not_null

      - name: srm_p_value
        data_tests:
          - not_null

      - name: srm_detected
        data_tests:
          - not_null

      - name: is_statistically_significant
        data_tests:
          - not_null

      - name: estimated_incremental_purchases
        data_tests:
          - not_null

      - name: experiment_decision
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Investigate Experiment
                  - No Significant Effect
                  - Recommend Treatment
                  - Recommend Control